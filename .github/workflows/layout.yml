name: ORIE layout and manifest smoke (not compiler tests)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check four independent package roots and fixture paths
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ores.pkg.toml
          for pkg in orie-numerics orie-opt orie-sim orie-plan; do
            test -f "packages/$pkg/.ores.pkg.toml"
            test -f "packages/$pkg/README.md"
          done
          test -f packages/orie-numerics/tests/matrix_contract.ores
          test -f packages/orie-opt/tests/optimization_contract.ores
          test -f packages/orie-sim/tests/simulation_contract.ores
          test -f packages/orie-plan/tests/planning_contract.ores
          test "$(find packages -name '.ores.pkg.toml' -type f | wc -l)" -eq 4
          test "$(find packages -name '*.ores' -type f | wc -l)" -eq 12
          if find . -name '*.py' -o -name '*.pyi' -o -name '*.ipynb' | grep -q .; then
            echo "Python tooling prohibited" >&2
            exit 1
          fi
          echo "layout-only PASS: does not compile or run Oreslang"
