name: ORIE native-source layout (not compiler tests)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check four package roots and all native guest fixtures
        shell: bash
        env:
          ORIE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A PR checkout defaults to a synthetic merge commit; verify the
          # exact reviewed PR head instead of mislabeling a merge as the head.
          test "$(git rev-parse HEAD)" = "$ORIE_EXPECTED_HEAD"
          echo "ORIE_LAYOUT_SOURCE_HEAD=$ORIE_EXPECTED_HEAD"
          if find packages -type l -print -quit | grep -q .; then
            echo 'Symlinks inside packages are forbidden' >&2
            exit 1
          fi
          test ! -e .ores.pkg.toml
          for pkg in orie-numerics orie-opt orie-sim orie-plan; do
            test -f "packages/$pkg/.ores.pkg.toml"
            test -f "packages/$pkg/README.md"
          done
          # Static oracle inventory only; this does NOT compile or run fixtures.
          require_fixture() {
            local file="$1" marker="$2"
            test -f "$file"
            grep -Fq -- "Expected: $marker" "$file"
            grep -Fq -- "stdio.stdout.println(\"$marker\");" "$file"
          }
          require_fixture "packages/orie-numerics/tests/matrix_contract.ores" "PASS:orie-numerics"
          require_fixture "packages/orie-numerics/tests/linear_solve_contract.ores" "PASS:orie-linear-solve"
          require_fixture "packages/orie-opt/tests/optimization_contract.ores" "PASS:orie-opt"
          require_fixture "packages/orie-opt/tests/simplex_contract.ores" "PASS:orie-simplex"
          require_fixture "packages/orie-opt/tests/simplex_status_contract.ores" "PASS:orie-simplex-status"
          require_fixture "packages/orie-opt/tests/simplex_degenerate_contract.ores" "PASS:orie-simplex-degenerate"
          require_fixture "packages/orie-opt/tests/simplex_numerical_contract.ores" "PASS:orie-simplex-numerical"
          require_fixture "packages/orie-opt/tests/branch_and_bound_contract.ores" "PASS:orie-branch-and-bound"
          require_fixture "packages/orie-opt/tests/branch_and_bound_enumeration.ores" "PASS:orie-bnb-enumeration"
          require_fixture "packages/orie-sim/tests/simulation_contract.ores" "PASS:orie-sim"
          require_fixture "packages/orie-sim/tests/queueing_contract.ores" "PASS:orie-queueing"
          require_fixture "packages/orie-sim/tests/queueing_negative_contract.ores" "PASS:orie-sim-negative"
          require_fixture "packages/orie-plan/tests/planning_contract.ores" "PASS:orie-plan"
          test "$(find packages -type f -path '*/tests/*.ores' | wc -l)" -eq 13
          test "$(find packages -name '.ores.pkg.toml' -type f | wc -l)" -eq 4
          test "$(find packages -name '*.ores' -type f | wc -l)" -eq 27
          # Algorithms and tests are pure Oreslang: host implementations forbidden.
          if find . -type f \( -name '*.java' -o -name '*.class' \
             -o -name '*.jar' -o -name '*.py' -o -name '*.pyi' \
             -o -name '*.ipynb' -o -name '*.c' -o -name '*.cc' \
             -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
             -o -name '*.rs' -o -name '*.cs' -o -name '*.go' \
             -o -name '*.js' -o -name '*.ts' -o -name '*.swift' \) | grep -q .; then
            echo 'Forbidden host-language implementation or tooling present' >&2
            exit 1
          fi
          # Strip line comments before checking operators removed by the language.
          # This is a structural tripwire, NOT a parser or guest execution test.
          if find packages -type f -name '*.ores' -print0 |
             xargs -0 -r sed -E 's@//.*$@@' |
             grep -E '[%^]'; then
            echo 'Removed Oreslang operator present in guest source' >&2
            exit 1
          fi
          echo 'LAYOUT PASS only; native compiler tests not executed'
