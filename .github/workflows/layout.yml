name: ORIE native-source layout (not compiler tests)
on:
  # PR branches run once through pull_request; main retains push coverage.
  # A pull_request checkout is still explicitly pinned to its head SHA below.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Check four package roots and all native guest fixtures
        shell: bash
        env:
          ORIE_EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          # A PR checkout defaults to a synthetic merge commit; verify the
          # exact reviewed PR head instead of mislabeling a merge as the head.
          test "$(git rev-parse HEAD)" = "$ORIE_EXPECTED_HEAD"
          echo "ORIE_LAYOUT_SOURCE_HEAD=$ORIE_EXPECTED_HEAD"
          # Single authoritative fixture ledger: ci/guest-fixtures.tsv.
          # Source structure only; do not call this a guest/solver test.
          test -f ci/validate-guest-inventory.sh
          test ! -L ci/validate-guest-inventory.sh
          bash ci/validate-guest-inventory.sh
          # Synthetic source-free negative tests, not native guest execution.
          test -f ci/test-guest-inventory.sh
          test ! -L ci/test-guest-inventory.sh
          bash ci/test-guest-inventory.sh
          # Fail-closed compiler provenance preflight tests only. Their
          # synthetic tripwire compiler must never execute a single instruction.
          test -f ci/test-native-preflight.sh
          test ! -L ci/test-native-preflight.sh
          bash ci/test-native-preflight.sh
          # Synthetic checks of exact link argv construction and stdout pipe;
          # still no native Oreslang compiler/guest execution.
          test -f ci/test-native-link-transport.sh
          test ! -L ci/test-native-link-transport.sh
          bash ci/test-native-link-transport.sh
          # Six capability probes plus one dependency source. These are
          # authored guest sources, not executed native capability proofs.
          test -f ci/native-feature-probes.tsv
          test ! -L ci/native-feature-probes.tsv
          test "$(wc -l < ci/native-feature-probes.tsv)" -eq 6
          for probe in module_scalar_helper module_scalar f64_scalar array_i64 array_f64 result_class orie_stdio; do
            test -f "ci/probes/$probe.ores"
            test ! -L "ci/probes/$probe.ores"
          done
          test "$(find ci/probes -type f -name '*.ores' | wc -l)" -eq 7
          bash -n ci/run-native-fixtures.sh
          # Fail closed on duplicate native guest loops or missing feature receipts.
          bash ci/test-native-harness-structure.sh
          bash -n ci/test-native-link-transport.sh
          # Algorithms and tests are pure Oreslang: host implementations forbidden.
          if find . -type f \( -name '*.java' -o -name '*.class' \
             -o -name '*.jar' -o -name '*.py' -o -name '*.pyi' \
             -o -name '*.ipynb' -o -name '*.c' -o -name '*.cc' \
             -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
             -o -name '*.rs' -o -name '*.cs' -o -name '*.go' \
             -o -name '*.js' -o -name '*.ts' -o -name '*.swift' \) | grep -q .; then
            echo 'Forbidden host-language implementation or tooling present' >&2
            exit 1
          fi
          # Strip line comments before checking operators removed by the language.
          # This is a structural tripwire, NOT a parser or guest execution test.
          if find packages -type f -name '*.ores' -print0 |
             xargs -0 -r sed -E 's@//.*$@@' |
             grep -E '[%^]'; then
            echo 'Removed Oreslang operator present in guest source' >&2
            exit 1
          fi
          echo 'LAYOUT PASS only; native compiler tests not executed'
