name: ORIE native-source layout (not compiler tests)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Check four package roots and all native guest fixtures
        shell: bash
        run: |
          set -euo pipefail
          test ! -e .ores.pkg.toml
          for pkg in orie-numerics orie-opt orie-sim orie-plan; do
            test -f "packages/$pkg/.ores.pkg.toml"
            test -f "packages/$pkg/README.md"
          done
          for fixture in \
            packages/orie-numerics/tests/matrix_contract.ores \
            packages/orie-numerics/tests/linear_solve_contract.ores \
            packages/orie-opt/tests/optimization_contract.ores \
            packages/orie-opt/tests/simplex_contract.ores \
            packages/orie-opt/tests/simplex_status_contract.ores \
            packages/orie-opt/tests/branch_and_bound_contract.ores \
            packages/orie-sim/tests/simulation_contract.ores \
            packages/orie-sim/tests/queueing_contract.ores \
            packages/orie-plan/tests/planning_contract.ores; do
            test -f "$fixture"
          done
          test -f packages/orie-opt/tests/branch_and_bound_enumeration.ores
          test -f packages/orie-opt/tests/simplex_degenerate_contract.ores
          test -f packages/orie-opt/tests/simplex_numerical_contract.ores
          test -f packages/orie-sim/tests/queueing_negative_contract.ores
          test "$(find packages -name '.ores.pkg.toml' -type f | wc -l)" -eq 4
          test "$(find packages -name '*.ores' -type f | wc -l)" -eq 27
          # Algorithms and tests are pure Oreslang: host implementations forbidden.
          if find . -type f \( -name '*.java' -o -name '*.class' \
             -o -name '*.jar' -o -name '*.py' -o -name '*.pyi' \
             -o -name '*.ipynb' -o -name '*.c' -o -name '*.cc' \
             -o -name '*.cpp' -o -name '*.h' -o -name '*.hpp' \
             -o -name '*.rs' -o -name '*.cs' -o -name '*.go' \
             -o -name '*.js' -o -name '*.ts' -o -name '*.swift' \) | grep -q .; then
            echo 'Forbidden host-language implementation or tooling present' >&2
            exit 1
          fi
          # Strip line comments before checking operators removed by the language.
          # This is a structural tripwire, NOT a parser or guest execution test.
          if find packages -type f -name '*.ores' -print0 |
             xargs -0 -r sed -E 's@//.*$@@' |
             grep -E '[%^]'; then
            echo 'Removed Oreslang operator present in guest source' >&2
            exit 1
          fi
          echo 'LAYOUT PASS only; native compiler tests not executed'
